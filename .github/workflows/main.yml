name: Build EastSideNEL

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: 还原依赖（不指定 RID）
      run: dotnet restore EastSideNEL.slnx

    # 按依赖顺序构建各个项目
    - name: 构建 EastSide.Core
      run: dotnet build EastSide.Core/EastSide.Core.csproj -c Release -r win-x64 --no-restore

    - name: 构建 EastSide.IRC
      run: dotnet build EastSide.IRC/EastSide.IRC.csproj -c Release -r win-x64 --no-restore

    - name: 构建 EastSide
      run: dotnet build EastSide/EastSide.csproj -c Release -r win-x64 --no-restore

    - name: 构建 EastSide.UI（主程序）
      run: dotnet build EastSide.UI/EastSide.UI.csproj -c Release -r win-x64 --no-restore

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: EastSideNEL-Build
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.pdb
