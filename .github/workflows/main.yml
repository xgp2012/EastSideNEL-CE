name: Build EastSideNEL

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: windows-latest  # 由于项目引用了 Windows 特定的 SDK DLL，建议使用 Windows 环境

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: 还原依赖
      run: dotnet restore EastSideNEL.slnx

    - name: 构建项目
      run: dotnet build EastSideNEL.slnx --no-restore -c Release

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: EastSideNEL-Build
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.pdb
