name: Build EastSideNEL

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: 还原依赖（指定运行时 win-x64）
      run: dotnet restore EastSideNEL.slnx -r win-x64

    - name: 构建项目（指定运行时 win-x64）
      run: dotnet build EastSideNEL.slnx --no-restore -c Release -r win-x64

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: EastSideNEL-Build
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.pdb
